name: Daily Log Summary & Issue Alert

on:
  schedule:
    # Note: GitHub Actions cron expressions are in UTC, but the timezone field allows specifying the local timezone for the schedule.
    - cron: '2 0 * * *'
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target log date (YYYY-MM-DD, defaults to previous day)'
        required: false
        type: string
        default: ''
      force:
        description: 'Force send email even if 0 issues'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run-daily-summary:
    name: Execute Daily Issue Summary
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Daily Summary Webhook
        env:
          CRON_KEY: ${{ secrets.CRON_KEY || 'kcb-daily-summary-token' }}
          TARGET_DATE: ${{ github.event.inputs.target_date }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ -z "$TARGET_DATE" ]; then
            TARGET_DATE=$(TZ="America/New_York" date -d "yesterday" +%Y-%m-%d 2>/dev/null || TZ="America/New_York" date -v-1d +%Y-%m-%d)
          fi
          URL="https://www.keystoneconcertband.com/api/cron/daily_log_summary.php?key=${CRON_KEY}&date=${TARGET_DATE}"
          if [ "$FORCE" = "true" ]; then
            URL="${URL}&force=1"
          fi

          echo "Target Date: $TARGET_DATE"
          echo "Pinging Daily Summary API Endpoint..."
          HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "$URL")
          HTTP_BODY=$(echo "$HTTP_RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n 1 | cut -d':' -f2)

          echo "Response Status: $HTTP_STATUS"
          echo "Response Body:"
          echo "$HTTP_BODY"

          # Write to GitHub Step Summary
          echo "### Daily Log Summary Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Date:** \`$TARGET_DATE\`" >> $GITHUB_STEP_SUMMARY
          echo "- **HTTP Status:** \`$HTTP_STATUS\`" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$HTTP_BODY" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Daily summary trigger returned status $HTTP_STATUS"
            exit 1
          fi