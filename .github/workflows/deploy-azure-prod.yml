# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Azure Deploy prod

permissions:
  contents: read
  actions: read

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.yml'
      - '**.yaml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v3
        with:
          files: 'composer.json'

      - name: Run composer install if composer.json exists
        if: steps.check_files.outputs.files_exists == 'true'
        run: composer validate --no-check-publish && composer install --prefer-dist --no-progress

      - name: Clean up non-production files before publishing
        run: |
          # 1. Version control, CI/CD, and IDE configs
          rm -rf .git .github .gitignore .gitattributes .vscode

          # 2. Markdown, plaintext docs, and changelogs
          find . -type f \( -name "*.md" -o -name "*.markdown" \) -delete
          find . -type f \( -name "README*" -o -name "CHANGELOG*" -o -name "LICENSE*" -o -name "CONTRIBUTING*" -o -name "RELEASE-DATE-*" \) -delete

          # 3. Dependency & build manifests (vendor/ is already installed)
          rm -f composer.json composer.lock
          rm -f pma/composer.json pma/composer.lock pma/package.json pma/yarn.lock pma/babel.config.json

          # 4. phpMyAdmin setup & SQL schemas
          rm -rf pma/setup pma/sql pma/config.sample.inc.php

          # 5. OS metadata & source maps
          find . -type f -name ".DS_Store" -delete
          find . -type f -name "*.map" -delete

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7
        with:
          name: php-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: php-app

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v2
        id: deploy-to-webapp
        with:
          app-name: 'webserver-prod'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_10C92195BA30474A94F7B068575A8487 }}
          package: .
